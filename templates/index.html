<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tej's Spam Predictor</title>

    <!-- Connect CSS -->
    <link rel="stylesheet" href="/static/style.css">

</head>

<body>

    <!-- ================= HEADER ================= -->

    <header>
        <h1>Tej's Spam Predictor</h1>
    </header>


    <!-- ================= MAIN ================= -->

    <main>

        <div class="page">

            <!-- ================= FORM ================= -->

            <form action="/predict_spam" method="post">

                <textarea
                    id="input_mail"
                    name="input_mail"
                    placeholder="Enter your email..."
                    required
                ></textarea>

                <button type="submit">
                    Scan
                </button>

            </form>


            <!-- ================= PREDICTION ================= -->

            {% if prediction %}

            <div class="result">

                <span class="result-label">
                    Prediction
                </span>

                <h2>
                    {{ prediction }}
                </h2>

            </div>

            {% endif %}


        </div>

    </main>

</body>

</html>
